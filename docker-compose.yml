# ============================================================
# GGUF-Manager docker-compose.yml
# ============================================================
# 首次启动后 ./config/settings.json 会自动生成，也可直接编辑该文件。

services:
  gguf-manager:
    # 本地构建（用同目录下的 Dockerfile）
    # ⭐ 镜像 tag 与构建参数统一取 .env 的 GGUF_DOCKER_TAG，
    #    而 .env 由 scripts/verify_release.py 从 app/__init__.py 派生，不另设版本来源。
    build:
      context: .
      args:
        APP_VERSION: ${GGUF_DOCKER_TAG}
    image: gguf-manager:${GGUF_DOCKER_TAG}
    # 使用远端镜像时注释掉 build，并把 image 换成：
    # image: docker.cnb.cool/1983shake/gguf-manager:${GGUF_DOCKER_TAG}
    container_name: gguf-manager
    restart: unless-stopped

    ports:
      - "8200:8200"

    volumes:
      # 模型文件（大文件，建议放空间充足的盘）
      - ./models:/app/models

      # ⭐ 配置持久化卷：Web 设置面板的所有改动都存这里
      - ./config:/app/config
      # Docker socket for fallback reload (docker restart)
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # 容器内模型目录（改挂载路径时同步调整）
      - MODEL_DIR=/app/models

      # 配置目录：指向上面挂载的卷
      - CONFIG_DIR=/app/config

      # 日志时区。容器默认 UTC，这里设成北京时间
      - LOG_TZ=Asia/Shanghai

      # 需要下载 gated 模型时填 Token
      # - HF_TOKEN=your_token_here
