# docker-compose.yml
# GGUF-Manager v1.3.0
# 首次启动后 ./config/settings.json 会自动生成，也可直接编辑该文件。

services:
  gguf-manager:
    # 本地构建（用同目录下的 Dockerfile）
    #build: .
    # 使用已发布镜像时改为下面这行，并注释掉上面的 build
    image: docker.cnb.cool/1983shake/gguf-manager:latest
    container_name: gguf-manager
    restart: unless-stopped

    ports:
      - "8200:8200"

    volumes:
      # 模型文件（大文件，建议放空间充足的盘）
      - ./models:/app/models

      # ⭐ 配置持久化卷：Web 设置面板的所有改动都存这里
      - ./config:/app/config
      # Docker socket for fallback reload (docker restart)
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # 容器内模型目录（改挂载路径时同步调整）
      - MODEL_DIR=/app/models

      # 配置目录：指向上面挂载的卷
      - CONFIG_DIR=/app/config

      # 日志时区。容器默认 UTC，这里设成北京时间
      - LOG_TZ=Asia/Shanghai

      # 需要下载 gated 模型时填 Token
      # - HF_TOKEN=your_token_here
